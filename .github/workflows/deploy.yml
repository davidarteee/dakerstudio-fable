name: Construir i publicar a la branca hostinger

# GitHub compila el codi (servidors moderns, sense el problema de glibc de Hostinger)
# i deixa el resultat de out/ a la branca `hostinger`. A Hostinger es connecta AQUESTA
# branca com a lloc estàtic SENSE build: només serveix els fitxers ja compilats.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-hostinger
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Construir (Next.js -> out/)
        run: npm run build

      - name: Publicar out/ a la branca hostinger
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build estatic de ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:hostinger
